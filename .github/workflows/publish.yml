name: Build and Publish

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Paperband 0.2.0 isn't on Maven Central yet, so build it from its public repo,
      # pinned to the 0.2.0 commit. Once 0.2.0 is on Central, drop this step and "Install Paperband".
      - name: Checkout Paperband
        uses: actions/checkout@v4
        with:
          repository: noregressions/paperband
          ref: 5437e58e91db20af1b53d36f887b8c1b776d22cb   # Paperband 0.2.0
          path: paperband
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Install Paperband
        run: make paperband PAPERBAND_DIR=paperband

      - name: Build site
        run: make website

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
